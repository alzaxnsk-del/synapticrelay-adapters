name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, Typecheck, Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Run integration smoke tests
        run: npx jest tests/integration-smoke.test.ts --config jest.config.js

      - name: Validate example manifests
        run: npm run validate:examples

  python:
    name: Python Adapter
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python adapter
        run: |
          cd adapters/python
          pip install -e ".[dev]"

      - name: Compile check
        run: |
          cd adapters/python
          python -m py_compile synapticrelay/__init__.py
          python -m py_compile synapticrelay/client.py
          python -m py_compile synapticrelay/manifest.py
          python -m py_compile synapticrelay/decorators.py
          python -m py_compile synapticrelay/health.py

      - name: Test Python manifest validation
        run: |
          cd adapters/python
          python -m pytest tests/ -v 2>/dev/null || python tests/test_manifest.py
