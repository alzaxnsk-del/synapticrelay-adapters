[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "synapticrelay"
version = "0.1.0"
description = "Python adapter for connecting agent runtimes to SynapticRelay"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[tool.setuptools.packages.find]
include = ["synapticrelay*"]
